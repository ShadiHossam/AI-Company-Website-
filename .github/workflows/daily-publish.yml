name: Daily page publish

# Triggers the existing o2switch daily-publish pipeline over HTTPS instead of SSH.
#
# History: the first version of this workflow (2026-09-02/03) tried to run the whole
# pipeline directly on the GitHub runner over SSH, mirroring shadi-hossam-website's
# daily-index.yml. That failed — o2switch's firewall rejects SSH connections from
# GitHub's runner IPs outright ("Connection timed out", confirmed via a live test run),
# almost certainly an IP allowlist. Unlike shadi-hossam-website (a static build, deployed
# via FTPS with no server-side execution needed), this site is SSR and its build has to
# run on the server — so it can't avoid needing *some* connection to o2switch.
#
# The fix: outbound HTTPS to the site itself is not blocked (it's a public website), so
# GitHub Actions now just POSTs to an authenticated webhook (astro-site/src/pages/api/
# deploy/publish.ts) that runs the same publish-repo-scripts/daily-publish-{en,ar}.sh
# locally on the server — no SSH hop needed, since the code runs there already. That
# route fires the script detached and returns immediately (the actual commit/push/build
# x2/restart x2/verify can take minutes); check /api/deploy/status for the log tail.

on:
  schedule:
    - cron: "17 7 * * *" # ~9:17am CEST / 11:17am Gulf time
  workflow_dispatch:
    inputs:
      target:
        description: "Which queue to publish"
        required: false
        default: both
        type: choice
        options:
          - both
          - en
          - ar
          - probe

concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  trigger-publish:
    runs-on: ubuntu-latest
    env:
      WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
    steps:
      # "probe" sends an invalid target: a 400 means the request reached the app and
      # the secret matched, without publishing anything. It tries both hosts, since
      # GitHub's runners stopped reaching aicompany.usine.site directly on 2026-09-17.
      - name: Probe webhook reachability
        if: github.event.inputs.target == 'probe'
        run: |
          for url in http://aicompany.usine.site https://lenooai.com; do
            code=$(curl -s -o body.txt -w "%{http_code}" --max-time 20 -X POST "$url/api/deploy/publish" \
              -H "Authorization: Bearer $WEBHOOK_SECRET" -H "Content-Type: application/json" \
              -d '{"target":"probe"}') || code="curl-exit-$?"
            echo "$url -> $code $(head -c 300 body.txt 2>/dev/null)"
          done

      - uses: actions/checkout@v4
        if: github.event.inputs.target != 'probe'
        with:
          sparse-checkout: .github/scripts

      - name: Trigger EN publish
        if: github.event.inputs.target != 'ar' && github.event.inputs.target != 'probe'
        run: ./.github/scripts/trigger-publish.sh en

      - name: Trigger AR publish
        if: github.event.inputs.target != 'en' && github.event.inputs.target != 'probe'
        run: ./.github/scripts/trigger-publish.sh ar
