name: IndexNow submit

# Tells Bing (and the other IndexNow engines) about new or changed lenooai.com
# URLs instead of waiting for them to be crawled.
#
# Runs every 30 minutes rather than once after daily-publish.yml, because pages
# go live in more than one way: the daily publish, posts published from the
# admin, and scheduled posts that appear by themselves at midnight Dubai time.
# Polling the live sitemap catches all of them. The sitemap is edge-cached for
# up to an hour, so a new page is submitted within about 90 minutes.
#
# The workflow saves each URL's lastmod in the Actions cache. A URL is sent only
# when it is new or its lastmod changed since the previous run, so frequent runs
# do not resubmit the same pages. If the cache was evicted, that run falls back
# to lastmod within 48h and saves a fresh list. Use the "all" mode to resubmit
# every URL in the sitemap.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which URLs to submit"
        required: false
        default: recent
        type: choice
        options:
          - recent
          - all

concurrency:
  group: indexnow
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore URL list from the last run
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
          restore-keys: indexnow-state-

      - name: Submit URLs to IndexNow
        run: node scripts/indexnow-submit.mjs --state=.indexnow-state.json ${{ github.event.inputs.mode == 'all' && '--all' || '' }}

      - name: Save URL list for the next run
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
