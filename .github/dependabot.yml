# Monthly dependency PRs. Security advisories still get PRs as soon as they're
# published (GitHub's Dependabot security updates, enabled in repo settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /astro-site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
